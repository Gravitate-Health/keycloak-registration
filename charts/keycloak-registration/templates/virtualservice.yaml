{{- if eq .Values.networking.type "istio" }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ include "keycloak-registration.fullname" . }}
  labels:
    {{- include "keycloak-registration.labels" . | nindent 4 }}
spec:
  hosts:
    {{- toYaml .Values.networking.istio.virtualService.hosts | nindent 4 }}
  gateways:
    {{- toYaml .Values.networking.istio.virtualService.gateways | nindent 4 }}
  http:
    - retries:
        attempts: {{ .Values.networking.istio.virtualService.retries.attempts }}
      match:
        {{- range .Values.networking.istio.virtualService.prefixMatches }}
        - uri:
            prefix: {{ . | quote }}
        {{- end }}
        {{- range .Values.networking.istio.virtualService.exactMatches }}
        - uri:
            exact: {{ . | quote }}
        {{- end }}
      rewrite:
        uri: {{ .Values.networking.istio.virtualService.rewriteUri | quote }}
      route:
        - destination:
            host: {{ include "keycloak-registration.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
{{- end }}
