apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak-registration.fullname" . }}-config
  labels:
    {{- include "keycloak-registration.labels" . | nindent 4 }}
data:
  KEYCLOAK_BASE_PATH: {{ .Values.config.KEYCLOAK_BASE_PATH | quote }}
  GLENS_PROFILE_BASE_PATH: {{ .Values.config.GLENS_PROFILE_BASE_PATH | quote }}
  PATIENT_PATH: {{ .Values.config.PATIENT_PATH | quote }}
  KEYCLOAK_REALM: {{ .Values.config.KEYCLOAK_REALM | quote }}
